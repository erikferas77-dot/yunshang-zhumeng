# Fly.io 部署配置 — api.yszmai.com
# 部署: cd api && fly launch --no-deploy && fly secrets set ... && fly deploy

app = "yszmai-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health/liveliness"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
