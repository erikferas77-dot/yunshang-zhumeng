# 云上逐梦 API 网关 — GPT-5.6 Sol 单模型路由
# OpenAI 上游密钥只保存在服务器环境变量中，不会发送给网页端。

model_list:
  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
